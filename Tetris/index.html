<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0f15">
    <title>Tetris</title>
    <link rel="icon" type="image/svg+xml" href="../assets/dino.svg">
    <link href="tetris.css?v=1.016" rel="stylesheet">
</head>
<body>
    <main class="stage">
        <canvas id="game" tabindex="0" aria-label="Tabuleiro do Tetris"></canvas>

        <div class="touch-controls" aria-label="Controles de toque">
            <button type="button" data-action="moveLeft" aria-label="Esquerda">◀</button>
            <button type="button" data-action="softDrop" aria-label="Descer">▼</button>
            <button type="button" data-action="moveRight" aria-label="Direita">▶</button>
            <button type="button" data-action="rotateCW" aria-label="Girar">⟳</button>
            <button type="button" data-action="hardDrop" aria-label="Queda instantânea">⤓</button>
            <button type="button" data-action="hold" aria-label="Guardar peça">H</button>
            <button type="button" data-action="pause" aria-label="Pausar">❚❚</button>
            <button type="button" data-action="specials" aria-label="Peças especiais">✦</button>
        </div>
    </main>

    <script src="fx.js?v=1.016"></script>
    <script src="tetris.js?v=1.016"></script>
</body>
</html>
