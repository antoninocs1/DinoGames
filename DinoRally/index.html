<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d26">
    <title>Dino Rally</title>
    <link rel="icon" type="image/svg+xml" href="../assets/dino.svg">
    <link rel="stylesheet" href="../assets/combobox.css?v=1.027">
    <link rel="stylesheet" href="style.css?v=1.027">
</head>
<body>
    <main class="stage">
        <canvas id="game" tabindex="0" aria-label="Dino Rally"></canvas>

        <div class="menu" id="menu">
            <div class="menu-fields">
                <label class="field">
                    <span>Modo de jogo</span>
                    <select id="mode" aria-label="Modo de jogo">
                        <option value="endurance">Resistência (7 dias)</option>
                        <option value="race">Corrida (largada e chegada)</option>
                    </select>
                </label>
                <label class="field">
                    <span>Números nos carros</span>
                    <select id="numbers" aria-label="Números nos carros">
                        <option value="1">Com números</option>
                        <option value="0">Sem números</option>
                    </select>
                </label>
            </div>
            <div class="menu-actions">
                <button type="button" id="btn-start" class="primary">Correr ▶</button>
                <button type="button" id="btn-retry" hidden>Repetir corrida</button>
            </div>
        </div>

        <div class="touch" aria-label="Controles de toque">
            <div class="touch-group">
                <button type="button" data-key="left" aria-label="Esquerda"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button type="button" data-key="right" aria-label="Direita"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="touch-middle">
                <button type="button" class="touch-swap" aria-label="Trocar o lado dos botões" aria-pressed="true">⇄</button>
                <button type="button" class="touch-pause" data-key="pause" aria-label="Pausar">❚❚</button>
            </div>
            <div class="touch-group">
                <button type="button" data-key="brake" class="brake" aria-label="Freio"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button type="button" data-key="gas" class="gas" aria-label="Acelerar"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
        </div>
    </main>

    <script src="../assets/combobox.js?v=1.027"></script>
    <script src="rally.js?v=1.027"></script>
</body>
</html>
